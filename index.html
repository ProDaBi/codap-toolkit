<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CODAP-Toolkit – Kapitelübersicht (Entwurf)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F4F6FA; --surface:#FFFFFF; --sunken:#EDF1F7; --ink:#151D2C; --muted:#5A6477; --line:#D7DEE9;
  --blue:#0025AA; --blue-soft:#E4E9F8; --teal:#157A7A; --teal-soft:#DFF0EF; --amber:#9A6412; --amber-soft:#FAF1DF;
  font-family:"Atkinson Hyperlegible",Verdana,system-ui,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#0F131B; --surface:#171E29; --sunken:#1C2431; --ink:#E9EDF4; --muted:#9BA5B7; --line:#2A3443;
  --blue:#93A8FF; --blue-soft:#1C2850; --teal:#5BC6C2; --teal-soft:#13302F; --amber:#DFB263; --amber-soft:#2C2517;}}
:root[data-theme="dark"]{
  --paper:#0F131B; --surface:#171E29; --sunken:#1C2431; --ink:#E9EDF4; --muted:#9BA5B7; --line:#2A3443;
  --blue:#93A8FF; --blue-soft:#1C2850; --teal:#5BC6C2; --teal-soft:#13302F; --amber:#DFB263; --amber-soft:#2C2517;}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--paper);color:var(--ink);font-size:16.5px;line-height:1.5}
a{color:var(--blue)}
:focus-visible{outline:3px solid var(--teal);outline-offset:2px}

.wrap{max-width:1140px;margin:0 auto;padding:1.6rem clamp(1rem,4vw,2rem) 4rem}
.masthead{display:flex;flex-wrap:wrap;gap:.6rem 1.2rem;align-items:baseline;justify-content:space-between;
  padding-bottom:.9rem;border-bottom:2px solid var(--blue);margin-bottom:1.6rem}
.masthead h1{font-size:1.5rem;margin:0}
.masthead .sub{color:var(--muted);font-size:.92rem}
.entwurf{font-size:.8rem;border:1px solid var(--amber);color:var(--amber);background:var(--amber-soft);padding:.1rem .5rem;border-radius:3px}

.intro{max-width:64ch;color:var(--muted);margin:0 0 1.6rem}

/* Merkmals-Matrix */
.matrix{display:grid;grid-template-columns:11rem repeat(2,minmax(0,1fr));gap:.5rem;align-items:stretch}
.matrix .corner{}
.matrix .colhead,.matrix .rowhead{display:flex;align-items:center;font-size:.9rem;color:var(--muted)}
.matrix .colhead{justify-content:center;text-align:center;padding-bottom:.2rem}
.matrix .rowhead{font-weight:700;color:var(--ink)}
.cell{all:unset;cursor:pointer;display:flex;flex-direction:column;gap:.25rem;justify-content:center;
  min-height:5.2rem;padding:.7rem .8rem;border:1px solid var(--line);border-radius:7px;background:var(--surface)}
.cell:hover{border-color:var(--teal);background:var(--teal-soft)}
.cell[aria-pressed="true"]{background:var(--blue);border-color:var(--blue);color:#fff}
.cell .kap{font-size:.78rem;opacity:.75}
.cell .ttl{font-weight:700;line-height:1.25}
.cell.leer{background:var(--sunken);border-style:dashed;cursor:default;color:var(--muted);font-size:.85rem;align-items:flex-start;justify-content:center}
.cell.leer:hover{border-color:var(--line);background:var(--sunken)}
@media (max-width:760px){
  .matrix{grid-template-columns:1fr;gap:.45rem}
  .matrix .colhead,.matrix .corner{display:none}
  .matrix .rowhead{margin-top:.8rem}
}

h2{font-size:1.05rem;margin:2.2rem 0 .7rem;color:var(--muted);font-weight:700}
.quer{display:grid;grid-template-columns:11rem repeat(2,minmax(0,1fr));gap:.5rem;align-items:stretch}
.quer .spacer{}
@media (max-width:760px){.quer{grid-template-columns:1fr}.quer .spacer{display:none}}

/* Detailbereich */
.detail{margin-top:2rem;background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.detail-head{padding:1.1rem 1.3rem;background:var(--blue-soft);border-bottom:1px solid var(--line)}
.detail-head .kapnr{font-size:.85rem;color:var(--muted)}
.detail-head h3{margin:.15rem 0 .4rem;font-size:1.3rem}
.detail-head p{margin:0;color:var(--muted);font-style:italic}
.detail-body{display:grid;grid-template-columns:minmax(0,19rem) minmax(0,1fr);gap:0}
@media (max-width:860px){.detail-body{grid-template-columns:1fr}}
.bausteine{padding:.9rem .8rem;border-right:1px solid var(--line);background:var(--sunken)}
@media (max-width:860px){.bausteine{border-right:0;border-bottom:1px solid var(--line)}}
.bausteine ol{margin:0;padding:0;list-style:none}
.bausteine li{margin:0}
.bstn{all:unset;display:flex;gap:.6rem;width:100%;cursor:pointer;padding:.5rem .6rem;border-radius:6px;border:1px solid transparent}
.bstn:hover{background:var(--teal-soft)}
.bstn[aria-current="true"]{background:var(--surface);border-color:var(--line);box-shadow:inset 3px 0 0 var(--teal)}
.bstn .num{color:var(--muted);font-variant-numeric:tabular-nums;min-width:2.3rem;font-size:.9rem}
.bstn .was{font-weight:700;line-height:1.3}
.bstn .wie{display:block;font-weight:400;color:var(--muted);font-size:.85rem}
.side{padding:1.1rem 1.3rem}
.side .kopf{display:flex;flex-wrap:wrap;gap:.4rem 1rem;align-items:baseline;margin-bottom:.1rem}
.side .kopf .bnum{color:var(--muted);font-variant-numeric:tabular-nums}
.side .kopf h4{margin:0;font-size:1.15rem}
.side .ziel{color:var(--muted);margin:.2rem 0 .9rem}
.side dl{margin:0 0 1rem;display:flex;flex-wrap:wrap;gap:.3rem 1.6rem;font-size:.9rem}
.side dl div{display:flex;gap:.4rem}
.side dt{color:var(--muted)} .side dd{margin:0;font-weight:700}
.preview{border:1px solid var(--line);border-radius:7px;background:var(--surface);overflow:hidden;display:flex;flex-direction:column;flex:1}
.preview .ptabs{display:flex;border-bottom:1px solid var(--line)}
.preview .ptabs button{flex:1;font:inherit;font-size:.92rem;padding:.55rem;border:0;background:transparent;color:var(--muted);cursor:pointer;border-bottom:3px solid transparent}
.preview .ptabs button[aria-selected="true"]{color:var(--ink);font-weight:700;border-bottom-color:var(--teal)}
.preview .stage{flex:1;min-height:360px;display:grid;place-items:center;overflow:hidden;text-align:center;padding:1.5rem;color:var(--muted);font-size:.92rem;background:var(--sunken)}
.preview .stage[hidden]{display:none}
.preview .stage .pl{max-width:42ch}
.knopfreihe{display:flex;flex-wrap:wrap;gap:.6rem;justify-content:center;margin:.9rem 0 0}
.ladebtn{font:inherit;font-weight:700;padding:.45rem 1rem;border-radius:6px;border:0;background:var(--teal);color:#fff;cursor:pointer}
.ladebtn.zweit{background:var(--surface);color:var(--blue);border:1px solid var(--line)}
.preview .stage .pl strong{display:block;color:var(--ink);margin-bottom:.3rem}
.preview .pfoot{display:flex;justify-content:space-between;gap:1rem;align-items:center;padding:.5rem .8rem;border-top:1px solid var(--line);font-size:.85rem;color:var(--muted)}
.preview .pfoot a,.preview .pfoot button{font:inherit;font-size:.85rem;font-weight:700;padding:.35rem .8rem;border-radius:5px;border:1px solid var(--line);background:var(--surface);color:var(--blue);cursor:pointer;text-decoration:none}
.modal{position:fixed;inset:0;z-index:60;background:rgba(10,14,22,.72);display:grid;place-items:center;padding:clamp(.5rem,2vw,1.5rem)}
.modal .box{width:min(1500px,97vw);height:min(94vh,980px);background:var(--surface);border:1px solid var(--line);
  border-radius:10px;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 18px 48px rgba(0,0,0,.35)}
.modal .mkopf{display:flex;align-items:center;justify-content:space-between;gap:1rem;padding:.6rem .9rem;border-bottom:1px solid var(--line);background:var(--blue-soft)}
.modal .mkopf strong{font-size:1rem}
.modal .mkopf .rechts{display:flex;gap:.5rem;align-items:center;font-size:.88rem}
.modal .mkopf a,.modal .mkopf button{font:inherit;font-size:.88rem;font-weight:700;padding:.35rem .8rem;border-radius:5px;
  border:1px solid var(--line);background:var(--surface);color:var(--blue);cursor:pointer;text-decoration:none}
.modal iframe{flex:1;width:100%;border:0}
.warn{margin-top:1rem;font-size:.88rem;border-left:3px solid var(--amber);background:var(--amber-soft);color:var(--ink);padding:.5rem .8rem;border-radius:0 5px 5px 0}
.status{display:inline-block;font-size:.78rem;padding:.05rem .45rem;border-radius:3px;border:1px solid var(--line);background:var(--surface);color:var(--muted)}
.foot{margin-top:2.5rem;padding-top:1rem;border-top:1px solid var(--line);color:var(--muted);font-size:.85rem;max-width:66ch}
</style>
</head>
<body>
<div class="wrap">
  <header class="masthead">
    <div>
      <h1>CODAP-Toolkit</h1>
      <div class="sub">entwickelt vom ProDaBi-Team</div>
    </div>
    <span class="entwurf">Entwurf, Inhalte sind Platzhalter</span>
  </header>

  <h2>Einstieg in die Arbeit mit CODAP</h2>
  <div class="quer" id="einstieg"></div>

  <h2>Grundlegende Datenanalysen in CODAP</h2>
  <section aria-label="Kapitel nach Fragetyp">
    <div class="matrix" id="matrix"></div>
  </section>

  <h2>Vertiefende Arbeit mit CODAP</h2>
  <div class="quer" id="vertiefung"></div>

  <section class="detail" id="detail" aria-live="polite"></section>

</div>

<script>
const C8 = "https://codap.concord.org/app/?lang=de#shared=https%3A%2F%2Fcfm-shared.concord.org%2FaNTaeJEmJUSORMgZYIn6%2Ffile.json";

const KAP = {
  k1:{nr:"Kapitel 1",titel:"Erste Schritte mit CODAP",
    stufe:"Sek I/II",datensatz:"YOU-PB",status:"in Arbeit",
    b:[["1.1","Platzhalter-Baustein","Inhalt folgt"]]},
  k2:{nr:"Kapitel 2",titel:"Daten aufbereiten",
    stufe:"Sek I/II",datensatz:"Klimadaten",status:"in Arbeit",
    b:[["2.1","Platzhalter-Baustein","Inhalt folgt"]]},
  k3:{nr:"Kapitel 3",titel:"Verteilungen kategorialer Merkmale",
    stufe:"Sek I/II",datensatz:"YOU-PB",status:"in Arbeit",
    warn:"Zu prüfen: ob und wie sich Kreisdiagramme in CODAP V3 erzeugen lassen.",
    b:[["3.1","Platzhalter-Baustein","Inhalt folgt"]]},
  k4:{nr:"Kapitel 4",titel:"Zusammenhänge kategorialer Merkmale",
    stufe:"Sek I/II",datensatz:"YOU-PB",status:"geplant",
    b:[["4.1","Platzhalter-Baustein","Inhalt folgt"]]},
  k5:{nr:"Kapitel 5",titel:"Verteilungen metrischer Merkmale",
    stufe:"Sek I/II",datensatz:"YOU-PB",status:"in Arbeit",
    b:[["5.1","Platzhalter-Baustein","Inhalt folgt"]]},
  k6:{nr:"Kapitel 6",titel:"Zusammenhänge metrischer Merkmale",
    stufe:"Sek I/II",datensatz:"Klimadaten",status:"geplant",
    b:[["6.1","Platzhalter-Baustein","Inhalt folgt"]]},
  k7:{nr:"Kapitel 7",titel:"Zusammenhänge kategorialer und metrischer Merkmale",
    stufe:"Sek I/II",datensatz:"YOU-PB",status:"in Arbeit",
    b:[["7.1","Platzhalter-Baustein","Inhalt folgt"]]},
  k8:{nr:"Kapitel 8",titel:"Datenbasierte Entscheidungsbäume",
    stufe:"Sek I/II",datensatz:"YOU-PB",status:"geplant",
    b:[["8.1","Basisfunktionen","Entscheidungsbäume mit Arbor erstellen und interpretieren","https://youtu.be/TKd51DjsOHA",C8],
       ["8.2","Maschine spielen","Entscheidungsbäume systematisch erstellen und dokumentieren","https://youtu.be/OZ7PyVYJ8-Y",C8],
       ["8.3","Testen mit Testdaten","Entscheidungsbäume systematisch evaluieren","https://youtu.be/XfeumzxUsHY",C8],
       ["8.4","Pruning","Entscheidungsbäume systematisch optimieren","https://youtu.be/lqKY-1Y6Ph4",C8]]},
  k9:{nr:"Kapitel 9",titel:"Hypothesentests",
    stufe:"Sek I/II",datensatz:"YOU-PB",status:"geplant",
    warn:"Setzt ein Simulations-Plugin voraus. Verfügbarkeit in CODAP V3 prüfen.",
    b:[["9.1","Platzhalter-Baustein","Inhalt folgt"]]}
};

const MATRIX = [
  ["kategorial", "k3", "k4"],
  ["metrisch",   "k5", "k6"],
  ["kategorial + metrisch", null, "k7"]
];
const COLS = ["ein Merkmal","zwei oder mehr Merkmale"];
const EINSTIEG = ["k1","k2"];
const VERTIEFUNG = ["k8","k9"];
let aktiv = "k5";

const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function cellHTML(id){
  if (!id) return `<div class="cell leer">in dieser Fassung nicht vorgesehen</div>`;
  const k = KAP[id];
  return `<button class="cell" data-k="${id}" aria-pressed="${aktiv===id}">
    <span class="kap">${esc(k.nr)}</span><span class="ttl">${esc(k.titel)}</span></button>`;
}

function renderNav(){
  const m = document.getElementById("matrix");
  m.innerHTML = `<div class="corner"></div>${COLS.map(c => `<div class="colhead">${c}</div>`).join("")}` +
    MATRIX.map(([label,...ids]) => `<div class="rowhead">${label}</div>${ids.map(cellHTML).join("")}`).join("");
  document.getElementById("einstieg").innerHTML = `<div class="spacer"></div>` + EINSTIEG.map(cellHTML).join("");
  document.getElementById("vertiefung").innerHTML = `<div class="spacer"></div>` + VERTIEFUNG.map(cellHTML).join("");
  document.querySelectorAll(".cell[data-k]").forEach(b => b.onclick = () => {
    aktiv = b.dataset.k; aktivB = 0; renderNav(); renderDetail();
  });
}

let aktivB = 0;

function renderDetail(){
  const k = KAP[aktiv];
  if (aktivB >= k.b.length) aktivB = 0;
  document.getElementById("detail").innerHTML = `
    <div class="detail-head">
      <div class="kapnr">${esc(k.nr)} <span class="status">${esc(k.status)}</span></div>
      <h3>${esc(k.titel)}</h3>
    </div>
    <div class="detail-body">
      <div class="bausteine">
        <ol>${k.b.map(([n,was,wie],i) => `<li><button class="bstn" data-b="${i}" aria-current="${i===aktivB}">
          <span class="num">${n}</span>
          <span><span class="was">${esc(was)}</span><span class="wie">${esc(wie)}</span></span></button></li>`).join("")}</ol>
      </div>
      <div class="side" id="side"></div>
    </div>`;
  document.querySelectorAll(".bstn").forEach(b => b.onclick = () => { aktivB = +b.dataset.b; renderDetail(); });
  renderSide();
}

function grossesFenster(src, titel){
  const modal = document.createElement("div");
  modal.className = "modal";
  modal.innerHTML = `<div class="box" role="dialog" aria-modal="true" aria-label="CODAP: ${esc(titel)}">
      <div class="mkopf"><strong>CODAP: ${esc(titel)}</strong>
        <span class="rechts">
          <a href="${esc(src)}" target="_blank" rel="noopener">In neuem Tab öffnen</a>
          <button type="button" class="zu">Schließen</button>
        </span></div>
      <iframe src="${esc(src)}" title="CODAP: ${esc(titel)}" allowfullscreen allow="clipboard-write"></iframe>
    </div>`;
  const zu = () => { modal.remove(); document.removeEventListener("keydown", taste); };
  const taste = e => { if (e.key === "Escape") zu(); };
  modal.querySelector(".zu").onclick = zu;
  modal.onclick = e => { if (e.target === modal) zu(); };
  document.addEventListener("keydown", taste);
  document.body.appendChild(modal);
  modal.querySelector(".zu").focus();
}

function renderSide(){
  const k = KAP[aktiv];
  const b = k.b[aktivB];
  const nr = b[0], was = b[1], wie = b[2];
  const video = b[3] || "", codap = b[4] || "";
  const videoId = video.split("/").pop();

  document.getElementById("side").innerHTML = `
    <div class="kopf"><span class="bnum">${nr}</span><h4>${esc(was)}</h4></div>
    <p class="ziel">${esc(wie)}</p>
    <dl><div><dt>Stufe</dt><dd>${esc(k.stufe)}</dd></div>
        <div><dt>Datensatz</dt><dd>${esc(k.datensatz)}</dd></div>
        <div><dt>Dauer</dt><dd>10 min</dd></div></dl>
    <div class="preview">
      <div class="ptabs" role="tablist">
        <button role="tab" aria-selected="true" data-t="video">Video</button>
        <button role="tab" aria-selected="false" data-t="codap">CODAP-Dokument</button>
      </div>
      <div class="stage" id="stage"></div>
      <div class="pfoot"><span>${video ? "Video und Dokument laden erst auf Klick" : "Platzhalter, Inhalte folgen"}</span>
        ${codap ? `<a href="${esc(codap)}" target="_blank" rel="noopener">In neuem Tab öffnen</a>` : ""}</div>
    </div>
    ${k.warn ? `<p class="warn">${esc(k.warn)}</p>` : ""}`;

  const stage = document.getElementById("stage");
  const gate = (label, hinweis, src, titel) => {
    stage.innerHTML = `<div class="pl"><strong>${esc(label)}</strong>${esc(hinweis)}
      <p style="margin:.9rem 0 0"><button type="button" class="ladebtn">${esc(label)} laden</button></p></div>`;
    stage.querySelector(".ladebtn").onclick = () => {
      stage.innerHTML = `<iframe src="${esc(src)}" title="${esc(titel)}" allowfullscreen
        allow="accelerometer; clipboard-write; encrypted-media; picture-in-picture"
        style="width:100%;height:100%;border:0"></iframe>`;
    };
  };
  const zeige = {
    video: () => video
      ? gate("Video", "Beim Laden wird eine Verbindung zu YouTube hergestellt.",
             "https://www.youtube-nocookie.com/embed/" + videoId, "Video: " + was)
      : stage.innerHTML = `<div class="pl"><strong>Video, höchstens 90 Sekunden</strong>Zeigt den Arbeitsschritt: ${esc(wie)}.</div>`,
    codap: () => {
      if (!codap) {
        stage.innerHTML = `<div class="pl"><strong>CODAP-Dokument</strong>Vorbereitetes Dokument mit dem Datensatz ${esc(k.datensatz)}, passend zu diesem Baustein.</div>`;
        return;
      }
      stage.innerHTML = `<div class="pl"><strong>CODAP-Dokument</strong>Beim Laden wird eine Verbindung zu concord.org hergestellt. Im großen Fenster lässt sich CODAP deutlich bequemer bedienen.
        <span class="knopfreihe">
          <button type="button" class="ladebtn" data-a="gross">Im großen Fenster öffnen</button>
          <button type="button" class="ladebtn zweit" data-a="klein">Im kleinen Fenster öffnen</button>
        </span></div>`;
      stage.querySelector('[data-a="gross"]').onclick = () => grossesFenster(codap, was);
      stage.querySelector('[data-a="klein"]').onclick = () => {
        stage.innerHTML = `<iframe src="${esc(codap)}" title="CODAP: ${esc(was)}" allowfullscreen
          allow="clipboard-write" style="width:100%;height:100%;border:0"></iframe>`;
      };
    }
  };
  const show = t => {
    document.querySelectorAll("[data-t]").forEach(x => x.setAttribute("aria-selected", x.dataset.t===t));
    zeige[t]();
  };
  document.querySelectorAll("[data-t]").forEach(x => x.onclick = () => show(x.dataset.t));

  show("video");
}

renderNav(); renderDetail();
</script>
</body>
</html>
